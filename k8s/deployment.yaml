apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp266-api
  labels:
    app: mp266-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mp266-api
  template:
    metadata:
      labels:
        app: mp266-api
    spec:
      containers:
        - name: mp266-api
          image: mp266-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
