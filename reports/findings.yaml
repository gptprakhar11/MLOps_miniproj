# MP266 findings --- fill in every value, keep every key.
# Service Lead: Aayushman Mathpati (S24CSEU1033)
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G111"          # your group id, e.g. "G042"
problem_id: "MP266"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: true
    column: "spoilage_found_at_unloading"           # the column that must not be used as a feature
  unit_mixup:
    present: false
    column: null           # the column recorded in a different unit
    group_value: null      # the value of chamber whose rows are affected
    factor: null           # wrong value = right value x factor
  sentinel_value:
    present: true
    column: "storage_days"
    value: -1            # the special number typed instead of a blank
    count: 50            # how many rows have it
  duplicate_rows:
    present: false
    count: null            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: true
    column: "bag_weight_kg"
    start_date: "2026-02-07"       # first date with the stuck value, YYYY-MM-DD
    end_date: "2026-02-28"         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: false
    count: null            # rows whose target was typed 10 times too big
  spelling_variants:
    present: true
    column: "crop"
    true_levels: 3      # how many real categories there are after cleaning

tracking:
  experiment_name: "mp266_spoilage"
  best_run_id: "08ef2773e078440b8fb7e6bd31f39532"        # the MLflow run id of your v1 model
  registered_model_name: "mp266_spoilage_model"
  champion_version: 1

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    storage_days: null
    temp_set_c: null
    humidity_pct: null
    power_cuts_hours: null
    bag_weight_kg: null
    door_openings_per_day: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of chamber
    'Chamber 1': null
    'Chamber 2': null
    'Chamber 3': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
